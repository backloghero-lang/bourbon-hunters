name: Deploy Bourbon Hunters Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Security and domain tests
        run: pnpm test

      - name: Browser smoke tests
        shell: bash
        env:
          CODEX_NODE_MODULES: ${{ github.workspace }}/node_modules
          BH_SMOKE_URL: http://127.0.0.1:8765/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/bourbon-hunters-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          pnpm run test:ui

  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
      - codeql
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html sw.js sw-assets.generated.js manifest.json spirit-taxonomy.js _site/
          cp -R db icons _site/

          mkdir -p _site/assets
          cp -R assets/detail _site/assets/
          cp -R assets/brand _site/assets/
          cp -R assets/intro _site/assets/
          cp -R assets/bourbons _site/assets/
          if [ -d assets/profile-badges ]; then
            cp -R assets/profile-badges _site/assets/
          else
            echo "::warning::assets/profile-badges is missing; profile badge images will not be included"
          fi

          mkdir -p _site/design/figma-assets
          cp -R design/figma-assets/asset-pack-v1 _site/design/figma-assets/
          cp -R design/figma-assets/home-pack-v2 _site/design/figma-assets/
          cp -R design/figma-assets/scanner-pack-v1 _site/design/figma-assets/

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          timeout: 600000
